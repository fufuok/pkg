name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.27.x]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os}}
    steps:
      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go-version }}

      - name: Fetch Repository
        uses: actions/checkout@v3

      - name: Make Ready
        run: |
          go version
          go env
          go get -t -v ./...
          git rev-parse --short HEAD

      - name: Run Vet
        run: go vet ./...

      - name: Run Test
        run: go test -v -cover -covermode=atomic ./...

      - name: Run Test With Standard JSON
        run: go test -tags=std_json -v ./...

      # pkgapp 是独立模块, 根模块的 ./... 不会检查它.
      - name: Build pkgapp
        working-directory: examples/pkgapp/src
        run: go build ./...

      - name: Vet pkgapp
        working-directory: examples/pkgapp/src
        run: go vet ./...

      - name: Build pkgapp With Standard JSON
        working-directory: examples/pkgapp/src
        run: go build -tags=std_json ./...

      # 独立示例先验证声明的发布依赖, 不受开发 workspace 影响.
      - name: Build sqldb Example
        working-directory: examples/sqldb
        env:
          GOWORK: 'off'
        shell: pwsh
        run: go build -o (Join-Path $env:RUNNER_TEMP 'sqldb-example') .

      - name: Vet sqldb Example
        working-directory: examples/sqldb
        env:
          GOWORK: 'off'
        run: go vet ./...

      - name: Run sqldb Example
        working-directory: examples/sqldb
        env:
          GOWORK: 'off'
        run: go run .

      # 根模块检查后再联调当前 checkout, SQLite 驱动不进入根模块依赖.
      - name: Run sqldb Example With Current pkg
        shell: pwsh
        run: |
          $env:GOWORK = Join-Path $env:RUNNER_TEMP 'sqldb-example.work'
          go work init . ./examples/sqldb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go -C examples/sqldb run .
